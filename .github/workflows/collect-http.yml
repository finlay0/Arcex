name: HTTP source collection
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Status only, or an explicitly supervised upfront collection
        type: choice
        options: [status, upfront]
        default: status
      limit:
        description: Maximum source attempts, 1–100
        type: number
        default: 1
  schedule:
    # GitHub drops many scheduled triggers under load; four off-peak attempts an hour
    # keep the daily checks moving. The concurrency group stops overlapping runs.
    - cron: "7,22,37,52 * * * *"
permissions:
  contents: read
concurrency:
  group: arcex-http-collection
  cancel-in-progress: false
jobs:
  collect:
    # Standard Linux runners are free for public repos. Never fall back to paid private-repo compute.
    if: github.repository == 'finlay0/Arcex' && github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Process bounded HTTP work
        run: pnpm exec tsx scripts/collect-cloud.ts
        env:
          ARCEX_API_URL: https://api.arcex.dev
          ARCEX_COLLECTOR_TOKEN: ${{ secrets.ARCEX_HTTP_COLLECTOR_TOKEN }}
          COLLECTION_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || inputs.mode }}
          COLLECTION_LIMIT: ${{ github.event_name == 'schedule' && 100 || inputs.limit }}
    # No artifact uploads or dependency caches: private evidence stays in Arcex and no storage allowance is consumed.
